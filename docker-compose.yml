services:
  # ── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lecture_postgres
    environment:
      POSTGRES_USER: lecture_user
      POSTGRES_PASSWORD: lecture_pass
      POSTGRES_DB: lecture_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecture_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lecture_network
    restart: unless-stopped

  # ── Redis Cache ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lecture_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lecture_network
    restart: unless-stopped

  # ── FastAPI Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lecture_backend
    env_file:
      - .env.example
    environment:
      APP_ENVIRONMENT: production
      DEBUG: "False"
      MOCK_MODE: "False"
      DATABASE_URL: postgresql://lecture_user:lecture_pass@postgres:5432/lecture_db
      REDIS_URL: redis://redis:6379/0
      WHISPER_MODEL: "base"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lecture_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lecture_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - lecture_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  lecture_network:
    driver: bridge
