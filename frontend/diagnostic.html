<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Diagnostic - Lecture Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #4ec9b0; margin-bottom: 20px; }
        .test { background: #252526; padding: 15px; margin: 10px 0; border-left: 4px solid #0e639c; }
        .test.pass { border-left-color: #4ec9b0; }
        .test.fail { border-left-color: #f48771; }
        .label { color: #9cdcfe; font-weight: bold; }
        .value { color: #ce9178; }
        .error { color: #f48771; }
        button { background: #007acc; color: white; border: none; padding: 10px 20px; cursor: pointer; margin: 5px; }
        button:hover { background: #005a9e; }
        pre { background: #1e1e1e; padding: 10px; overflow-x: auto; margin: 5px 0; }
        input, textarea { background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; padding: 8px; margin: 5px 0; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 API Diagnostic Tool</h1>
        
        <div class="test">
            <span class="label">API Base URL:</span>
            <span class="value" id="apiUrl">http://localhost:5000</span>
        </div>

        <h2 style="color: #4ec9b0; margin-top: 30px;">Test Session Creation</h2>
        <div class="test">
            <input type="text" id="title" placeholder="Lecture Title" value="Introduction to AI">
            <input type="text" id="subject" placeholder="Subject" value="Computer Science">
            <input type="text" id="instructor" placeholder="Instructor" value="Dr. Johnson">
            <button onclick="testCreateSession()">Create Session</button>
            <div id="sessionResponse" style="margin-top: 10px;"></div>
        </div>

        <h2 style="color: #4ec9b0; margin-top: 30px;">Video File Upload & Processing</h2>
        <div class="test">
            <input type="file" id="audioFile" accept="audio/*,video/*">
            <select id="language" style="margin: 5px 0;">
                <option value="en">English</option>
                <option value="ta">Tamil</option>
                <option value="hi">Hindi</option>
                <option value="te">Telugu</option>
            </select>
            <button onclick="testUpload()">Upload & Process</button>
            <div id="uploadResponse" style="margin-top: 10px;"></div>
        </div>

        <h2 style="color: #4ec9b0; margin-top: 30px;">API Tests</h2>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearLogs()">Clear Logs</button>
        
        <div id="testResults" style="margin-top: 20px;"></div>
    </div>

    <script>
        const apiUrl = 'http://localhost:5000';
        let sessionId = null;
        let transcriptionId = null;

        function log(test, passed, message) {
            const container = document.getElementById('testResults');
            const testEl = document.createElement('div');
            testEl.className = `test ${passed ? 'pass' : 'fail'}`;
            testEl.innerHTML = `<span class="label">${test}:</span> ${passed ? '✓' : '✗'} <span class="value">${message}</span>`;
            container.appendChild(testEl);
            console.log(`${test}: ${message}`);
        }

        async function testCreateSession() {
            const title = document.getElementById('title').value;
            const subject = document.getElementById('subject').value;
            const instructor = document.getElementById('instructor').value;

            try {
                const resp = await fetch(`${apiUrl}/api/lecture/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, subject, instructor })
                });
                const data = await resp.json();
                
                if (resp.ok && data.id) {
                    sessionId = data.id;
                    document.getElementById('sessionResponse').innerHTML = `
                        <div style="color: #4ec9b0;">✓ Session Created</div>
                        <pre>ID: ${data.id}
Title: ${data.title}
Subject: ${data.subject}</pre>
                    `;
                    log('Session Creation', true, `Session created: ${data.id.substring(0, 8)}...`);
                } else {
                    document.getElementById('sessionResponse').innerHTML = `<div class="error">✗ Error: ${JSON.stringify(data)}</div>`;
                    log('Session Creation', false, JSON.stringify(data.detail || data));
                }
            } catch (e) {
                document.getElementById('sessionResponse').innerHTML = `<div class="error">✗ Error: ${e.message}</div>`;
                log('Session Creation', false, e.message);
            }
        }

        async function testUpload() {
            if (!sessionId) {
                alert('Please create a session first');
                return;
            }

            const file = document.getElementById('audioFile').files[0];
            const language = document.getElementById('language').value;

            if (!file) {
                alert('Please select an audio file');
                return;
            }

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('language', language);

                const resp = await fetch(`${apiUrl}/api/lecture/sessions/${sessionId}/transcribe`, {
                    method: 'POST',
                    body: formData
                });
                const data = await resp.json();

                if (resp.ok && data.id) {
                    transcriptionId = data.id;
                    document.getElementById('uploadResponse').innerHTML = `
                        <div style="color: #4ec9b0;">✓ Transcription Complete</div>
                        <pre>ID: ${data.id}
Text Length: ${data.text.length} chars
Confidence: ${data.confidence}
Language: ${data.language}</pre>
                        <div style="margin-top: 10px;">
                            <button onclick="testTranslate()">Test Translation</button>
                            <button onclick="testExtract()">Extract Keywords</button>
                            <button onclick="testSummarize()">Summarize</button>
                        </div>
                    `;
                    log('Transcription', true, `Transcribed: ${data.id.substring(0, 8)}...`);
                } else {
                    document.getElementById('uploadResponse').innerHTML = `<div class="error">✗ Error: ${JSON.stringify(data)}</div>`;
                    log('Transcription', false, JSON.stringify(data));
                }
            } catch (e) {
                document.getElementById('uploadResponse').innerHTML = `<div class="error">✗ Error: ${e.message}</div>`;
                log('Transcription', false, e.message);
            }
        }

        async function testTranslate() {
            if (!transcriptionId) return;
            try {
                const resp = await fetch(`${apiUrl}/api/lecture/transcriptions/${transcriptionId}/translate-all`, {
                    method: 'POST'
                });
                const data = await resp.json();
                if (resp.ok) {
                    const langs = Object.keys(data.translations).length;
                    log('Translation', true, `${langs} languages translated`);
                } else {
                    log('Translation', false, JSON.stringify(data));
                }
            } catch (e) {
                log('Translation', false, e.message);
            }
        }

        async function testExtract() {
            if (!transcriptionId) return;
            try {
                const resp = await fetch(`${apiUrl}/api/lecture/transcriptions/${transcriptionId}/extract`, {
                    method: 'POST'
                });
                const data = await resp.json();
                if (resp.ok) {
                    log('Extraction', true, `${data.keyword_count} keywords, ${data.formula_count} formulas`);
                } else {
                    log('Extraction', false, JSON.stringify(data));
                }
            } catch (e) {
                log('Extraction', false, e.message);
            }
        }

        async function testSummarize() {
            if (!sessionId) return;
            try {
                const resp = await fetch(`${apiUrl}/api/lecture/sessions/${sessionId}/summarize`, {
                    method: 'POST'
                });
                const data = await resp.json();
                if (resp.ok) {
                    log('Summarization', true, `${data.summary.length} char summary created`);
                } else {
                    log('Summarization', false, JSON.stringify(data));
                }
            } catch (e) {
                log('Summarization', false, e.message);
            }
        }

        async function runAllTests() {
            document.getElementById('testResults').innerHTML = '';
            
            // Test 1: Health
            try {
                const resp = await fetch(`${apiUrl}/health`);
                log('Backend Health', resp.ok, resp.ok ? 'Running' : 'Failed');
            } catch (e) {
                log('Backend Health', false, e.message);
            }

            // Test 2: Frontend can reach backend
            try {
                const resp = await fetch(`${apiUrl}/api/docs`);
                log('API Docs Available', resp.ok, resp.ok ? 'Accessible' : 'Not found');
            } catch (e) {
                log('API Docs', false, e.message);
            }

            // Test 3-6: Create session and test full flow
            testCreateSession();
        }

        function clearLogs() {
            document.getElementById('testResults').innerHTML = '';
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            console.log('Diagnostic tool loaded');
        });
    </script>
</body>
</html>
